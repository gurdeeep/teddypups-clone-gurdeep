# Netlify build and hosting settings.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Serve photos through Netlify Image CDN (resized, modern formats). Remove to use the original files.
  VITE_IMAGE_CDN = "netlify"

# Single-page app: every route is rendered by index.html in the browser, so any
# path that is not a real file (for example /faq or /puppies/copper-male) must
# be answered with index.html. Without this, refreshing a page returns a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints these file names, so they can be cached "forever".
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Photos and videos keep their names, so cache them for a week.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
